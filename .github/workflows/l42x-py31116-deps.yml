name: L42X Py31116 Dependency Resolve

on:
  push:
    branches:
      - l42x-py31116-cert-temp-20260905

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Verify exact certification toolchain
        run: |
          mkdir -p inputs locks wheelhouse evidence official-runtime
          python -VV | tee evidence/python-version.txt
          python - <<'PY'
          import sys
          assert sys.version_info[:3] == (3, 11, 16), sys.version
          PY
          python -m pip install --upgrade 'pip==26.2.1' 'pip-tools==7.6.1'
          python -m pip --version | tee evidence/pip-version.txt
          pip-compile --version | tee evidence/pip-tools-version.txt
      - name: Write byte-exact recovered L42W inputs
        run: |
          cat > inputs/runtime.in <<'EOF'
          # L42W selected-winner production runtime direct dependencies.
          fastapi==0.115.0
          uvicorn[standard]==0.30.0
          SQLAlchemy==2.0.29
          alembic==1.13.1
          psycopg2-binary==2.9.9
          pydantic==2.7.0
          pydantic-settings==2.2.1
          python-dotenv==1.0.1
          passlib[bcrypt]==1.7.4
          email-validator==2.2.0
          python-multipart==0.0.9
          httpx==0.27.0
          PGPy==0.6.0
          reportlab==4.4.9
          PyJWT
          cachetools
          boto3
          requests
          cryptography
          EOF
          cat > inputs/certification.in <<'EOF'
          -r runtime.in
          pytest==8.3.5
          prometheus-client
          python-dateutil
          EOF
          cat > inputs/optional-redis.in <<'EOF'
          -r runtime.in
          redis
          EOF
          sha256sum inputs/*.in | tee evidence/input-SHA256SUMS.txt
      - name: Generate exact deterministic hashed locks
        shell: bash
        run: |
          set -euo pipefail
          unset PIP_NO_INDEX || true
          export PIP_INDEX_URL=https://pypi.org/simple
          cd inputs
          pip-compile --resolver=backtracking --generate-hashes --no-emit-index-url --no-emit-trusted-host --output-file ../locks/runtime-py311.lock runtime.in > ../evidence/runtime-compile.log 2>&1
          cp ../locks/runtime-py311.lock ../locks/runtime-py311.first.lock
          pip-compile --resolver=backtracking --generate-hashes --no-emit-index-url --no-emit-trusted-host --output-file ../locks/runtime-py311.lock runtime.in > ../evidence/runtime-recheck.log 2>&1
          cmp ../locks/runtime-py311.first.lock ../locks/runtime-py311.lock
          rm ../locks/runtime-py311.first.lock
          pip-compile --resolver=backtracking --generate-hashes --no-emit-index-url --no-emit-trusted-host --output-file ../locks/certification-py311.lock certification.in > ../evidence/certification-compile.log 2>&1
          pip-compile --resolver=backtracking --generate-hashes --no-emit-index-url --no-emit-trusted-host --output-file ../locks/optional-redis-py311.lock optional-redis.in > ../evidence/optional-redis-compile.log 2>&1
          cd ..
          echo 'runtime_deterministic_recheck=PASS' | tee evidence/compile-status.txt
          sha256sum locks/*.lock | tee evidence/lock-SHA256SUMS.txt
      - name: Download exact wheelhouse and certification tooling
        run: |
          unset PIP_NO_INDEX || true
          export PIP_INDEX_URL=https://pypi.org/simple
          python -m pip download --require-hashes --only-binary=:all: -r locks/certification-py311.lock -d wheelhouse 2>&1 | tee evidence/certification-download.log
          python -m pip download --require-hashes --only-binary=:all: -r locks/optional-redis-py311.lock -d wheelhouse 2>&1 | tee evidence/redis-download.log
          python -m pip download --only-binary=:all: 'pip==26.2.1' 'pip-tools==7.6.1' -d wheelhouse 2>&1 | tee evidence/tooling-download.log
          sha256sum wheelhouse/* > evidence/wheelhouse-SHA256SUMS.txt
      - name: Build official CPython 3.11.16 fallback from L42W pinned source
        shell: bash
        run: |
          set -euo pipefail
          PY_SHA='91bcdebfdde239a003ae93738a7fce0f9230fee5c4bc2b86f6e6e8c6f98aabe8'
          PY_URL='https://www.python.org/ftp/python/3.11.16/Python-3.11.16.tar.xz'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl xz-utils libssl-dev zlib1g-dev libncurses-dev libreadline-dev libsqlite3-dev libgdbm-dev libdb-dev libbz2-dev libexpat1-dev liblzma-dev tk-dev libffi-dev uuid-dev
          mkdir -p build-python official-runtime/python
          curl -fsSLo build-python/Python-3.11.16.tar.xz "$PY_URL"
          echo "$PY_SHA  build-python/Python-3.11.16.tar.xz" | sha256sum -c - | tee evidence/python-source-sha256.txt
          tar -C build-python -xf build-python/Python-3.11.16.tar.xz
          pushd build-python/Python-3.11.16
          ./configure --prefix="$GITHUB_WORKSPACE/official-runtime/python" --with-ensurepip=install > "$GITHUB_WORKSPACE/evidence/python-configure.log" 2>&1
          make -j"$(nproc)" > "$GITHUB_WORKSPACE/evidence/python-make.log" 2>&1
          make install > "$GITHUB_WORKSPACE/evidence/python-make-install.log" 2>&1
          popd
          official-runtime/python/bin/python3.11 -VV | tee evidence/official-python-version.txt
          official-runtime/python/bin/python3.11 - <<'PY'
          import sys
          assert sys.version_info[:3] == (3,11,16), sys.version
          PY
          tar -C official-runtime -czf official-runtime/Python-3.11.16-official-L42W-fallback.tar.gz python
          sha256sum official-runtime/Python-3.11.16-official-L42W-fallback.tar.gz | tee evidence/official-runtime-SHA256.txt
          rm -rf official-runtime/python build-python
      - name: Upload exact dependency and runtime bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l42x-py31116-dependency-bundle
          path: |
            inputs/
            locks/
            wheelhouse/
            official-runtime/
            evidence/
          compression-level: 0
          retention-days: 7
